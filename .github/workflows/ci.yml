name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # setup-node reads `volta.node` from package.json
          node-version-file: package.json

      # Node 25+ no longer bundles corepack, so install it explicitly
      - name: Install corepack
        run: |
          npm install -g corepack@latest
          corepack enable
          yarn --version

      - id: install
        run: yarn install --immutable

      # each check runs even if an earlier one failed, so one run reports all failures
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn typecheck
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn test
      # builds only validate that the latest code builds; outputs are discarded
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn build
      - name: Build site
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn site:build
