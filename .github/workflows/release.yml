name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # reads the version from `packageManager` in package.json
      - uses: oven-sh/setup-bun@v2

      # Bun builds; npm publishes, since trusted publishing + provenance are
      # npm features. They need npm >= 11.5.1: Node 24 bundles a qualifying
      # npm 11, and newer npm majors may not support the runner's Node, so
      # npm isn't upgraded past what Node ships
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check npm version
        run: |
          npm --version
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 5)) {
              console.error("::error::trusted publishing needs npm >= 11.5.1");
              process.exit(1);
            }
          ' "$(npm --version)"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint

      - name: Set version from release tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not a semver version (expected vX.Y.Z)"
            exit 1
          fi
          npm version --no-git-tag-version --allow-same-version "$VERSION"
          # npm requires an explicit dist-tag for prerelease versions
          # ignore build metadata (`+...`), which may itself contain `-`
          if [[ "${VERSION%%+*}" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # `prepack` runs `bun run build`, which bakes the version set above into dist
      - run: npm publish --provenance --access public --tag "${{ steps.version.outputs.dist_tag }}"
